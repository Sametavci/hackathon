# Lunch² backend configuration. All keys are documented in docs/API_CONTRACT.md §5.
# Owner: Dev 1. Every key the MVP needs is declared here, so no other developer has to edit this file.

quarkus.http.port=8080

# Persistence (single-instance JSON snapshot store)
lunch2.data-file=${LUNCH2_DATA_FILE:./data/lunch2.json}
%test.lunch2.data-file=target/test-data/lunch2.json

# Admin / demo
lunch2.admin-key=${LUNCH2_ADMIN_KEY:dev-admin-key}
lunch2.demo-mode=${LUNCH2_DEMO_MODE:true}
lunch2.public-base-url=${LUNCH2_PUBLIC_BASE_URL:http://localhost:5173}

# Lunch slots and locations
lunch2.event-start-date=${LUNCH2_EVENT_START_DATE:TODAY}
lunch2.slot-times=11:30,12:15,13:00
lunch2.location.wuerzburg=Mensa Würzburg – Lunch² table (yellow sign)
lunch2.location.schweinfurt=Mensa Schweinfurt – Lunch² table (yellow sign)

# Conversation cards (empty key -> fallback cards only)
lunch2.ai.api-key=${GEMINI_API_KEY:}
lunch2.ai.model=${LUNCH2_AI_MODEL:gemini-3.8-flash}
lunch2.ai.timeout-ms=8000
%test.lunch2.ai.api-key=

# The SPA entry page must always be revalidated, otherwise browsers keep an old build for a day.
# Hashed files under /assets/ stay cacheable (Quarkus default).
quarkus.http.filter.spa-index.header."Cache-Control"=no-cache
quarkus.http.filter.spa-index.matches=/(index\\.html)?
quarkus.http.filter.spa-index.methods=GET,HEAD
